services:

  # ============================================================
  # Первый Kafka-брокер
  # ============================================================
  # Брокер хранит сообщения и обрабатывает запросы клиентов.
  # Одновременно он выполняет роль KRaft-контроллера.
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: kafka-1
    restart: unless-stopped
    ports:
      - "9092:9092"

    environment:

      # KRaft
      # Уникальный ID брокера и его роли в кластере.
      # kafka-1 и kafka-2 вместе образуют quorum контроллеров.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093

      # Listeners
      # Kafka использует разные endpoints для разных типов соединений:
      # - PLAINTEXT — общение брокеров внутри Docker-сети;
      # - EXTERNAL — подключения с хостовой машины;
      # - CONTROLLER — внутреннее управление KRaft.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Репликация и создание топиков
      # Служебные данные Kafka реплицируются между двумя брокерами.
      # Новые топики по умолчанию получают 3 partitions.
      # Автоматическое создание топиков отключено, чтобы создавать их
      # явно с нужным количеством partitions и replication factor.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    # Kafka считается готовой, когда начинает принимать подключения.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - kafka_data:/var/lib/kafka/data


  # ============================================================
  # Второй Kafka-брокер
  # ============================================================
  # Конфигурация практически такая же, но используется другой
  # NODE_ID и другой внешний порт. Вместе с kafka-1 он обеспечивает
  # репликацию partitions и возможность пережить отказ одного брокера.
  kafka-2:
    image: apache/kafka:4.3.1
    container_name: kafka-2
    restart: unless-stopped
    ports:
      - "9093:9092"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093

      # Внутренний адрес — kafka-2:29092.
      # Внешний адрес — localhost:9093, поскольку Docker
      # перенаправляет порт хоста 9093 на 9092 контейнера.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Те же настройки репликации и создания топиков,
      # что и у первого брокера.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - kafka_data:/var/lib/kafka/data


  # ============================================================
  # Kafka UI
  # ============================================================
  # Веб-интерфейс для просмотра и управления Kafka-кластером.
  # Подключается к брокерам по их внутренним Docker-адресам.
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: kafbat-ui
    restart: unless-stopped
    ports:
      - "8080:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092

    # UI запускается после того, как оба брокера прошли healthcheck.
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy


  # ============================================================
  # Приложение
  # ============================================================
  # Контейнер с нашим Producer и двумя Consumers.
  # Приложение не принимает входящие соединения, поэтому
  # пробрасывать его порты наружу не требуется.
  app:
    build: .
    restart: unless-stopped

    # Запускаем приложение только после готовности Kafka.
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy


# Именованный volume для хранения данных Kafka.
volumes:
  kafka_data: